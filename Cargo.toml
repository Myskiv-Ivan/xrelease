# Workspace: backend package here; CLI crate in `cli/` (binary `xrctl`).
[workspace]
members = ["cli"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/Myskiv-Ivan/xrelease"
homepage = "https://github.com/Myskiv-Ivan/xrelease"
authors = ["xrelease contributors"]

# Dependency versions shared by the backend and the CLI so they cannot drift.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# Public API docs are tracked incrementally; CI clippy enforces other lints.
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "xrelease"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Self-hosted release notifier — watch upstream sources and notify via Apprise, Novu, Slack, Telegram, SMTP, webhooks, and brokers"
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["releases", "notifications", "apprise", "novu", "self-hosted"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "xrelease"
path = "src/main.rs"

[lib]
name = "xrelease"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
# `join_all` for concurrent notification fan-out (alloc-only keeps it lean).
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.9"
# Official YAML-org fork of archived `serde_yaml` (drop-in via package rename).
serde_yaml = { package = "yaml_serde", version = "0.10" }
feed-rs = "2"
semver = "1"
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"
# Vendored OpenSSL so Docker/CI builds do not need host libssl for postgres TLS.
openssl = { version = "0.10", features = ["vendored"] }
postgres-openssl = "0.5"
thiserror = "2"
anyhow = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.9"
regex = "1"
axum = { version = "0.8", features = ["json", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
# At-rest AES-256-GCM for the config ledger (`config_revision.content`).
aes-gcm = { version = "0.10", features = ["zeroize"] }
base64 = { version = "0.22", features = ["std"] }
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
governor = "0.10"
# Prefer `aws_lc_rs` over `rust_crypto`: the latter pulls `rsa`, which is
# unpatched for RUSTSEC-2023-0071 (Marvin Attack timing sidechannel).
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }

# Message-broker sinks — always compiled (same surface as GHCR / release binaries).
rdkafka = "0.39"
async-nats = "0.50"
lapin = "4"
cron = "0.17.0"

[dev-dependencies]
wiremock = "0.6"
# Inherit the workspace tokio pin (anti-drift), adding only the test-only
# features on top. `tower` is a transitive dep, not a workspace dependency, so
# it stays a literal pin here.
tokio = { workspace = true, features = ["net", "io-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
