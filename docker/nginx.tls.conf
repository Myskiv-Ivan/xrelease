# xrelease UI — nginx with TLS termination (cert.pem + key.pem).
# Used by docker/compose.tls.yaml (replaces conf.d/default.conf).
# HTTP → HTTPS redirect; API proxy same as the plain HTTP image config.

map $http_x_forwarded_proto $xrelease_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /ui-config.js {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://xrelease:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $xrelease_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://xrelease:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $xrelease_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /ready {
        proxy_pass http://xrelease:8080/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $xrelease_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /metrics {
        proxy_pass http://xrelease:8080/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $xrelease_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /openapi.json {
        proxy_pass http://xrelease:8080/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $xrelease_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
