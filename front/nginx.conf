# xrelease UI — nginx reverse proxy
# Serves the static dashboard and proxies API / probes to the backend.
#
# Included from the nginx image's http{} context (conf.d/), so `map` is valid here.
# Prefer the edge proxy's X-Forwarded-Proto (HTTPS) over $scheme (always http to UI).

map $http_x_forwarded_proto $xrelease_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Config apply / validate can send full desired documents.
    client_max_body_size 10m;

    # SPA fallback (no HTTP redirects — client router owns paths)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime UI settings — never cache (regenerated on container start)
    location = /ui-config.js {
        add_header Cache-Control "no-store";
    }

    # Management API + webhooks (same-origin when VITE_API_URL is empty)
    location /api/ {
        proxy_pass http://xrelease:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $xrelease_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # System endpoints (probes + OpenAPI).
    # /metrics is unauthenticated on the backend. Safe here because compose
    # binds this server to 127.0.0.1 only; the edge-facing variants drop it
    # (docker/nginx.tls.conf, Helm ui.exposeMetrics).
    location = /health {
        proxy_pass http://xrelease:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $xrelease_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /ready {
        proxy_pass http://xrelease:8080/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $xrelease_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /metrics {
        proxy_pass http://xrelease:8080/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $xrelease_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /openapi.json {
        proxy_pass http://xrelease:8080/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $xrelease_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
