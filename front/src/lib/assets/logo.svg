<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 44" fill="none" role="img" aria-label="xrls">
	<!--
		Standalone twin of LogoMark.svelte (docs / static / og-image). An <img> or
		favicon SVG is an isolated document and cannot read app tokens, so the app
		palette is restated here as literals and switched on prefers-color-scheme.
		Values mirror app.css: primary teal, accent green, card chip.
	-->
	<style>
		.chip { fill: #0E1318 }
		.edge { stroke: #26BDAE; stroke-opacity: .4 }
		.scan { stroke: #26BDAE; stroke-opacity: .07 }
		.glyph { fill: #26BDAE }
		.mark { fill: #4AC777 }
		@media (prefers-color-scheme: light) {
			.chip { fill: #FFFFFF }
			.edge { stroke: #006F65; stroke-opacity: .35 }
			.scan { stroke: #006F65; stroke-opacity: .06 }
			.glyph { fill: #006F65 }
			.mark { fill: #007F3D }
		}
	</style>
	<rect class="chip" width="120" height="44" rx="7"/>
	<rect class="edge" x="1" y="1" width="118" height="42" rx="6" stroke-width="1.5"/>
	<path class="scan" d="M8 11h104M8 17h104M8 23h104M8 29h104M8 35h104" stroke-width="1"/>
	<!-- scale 0.78 keeps the wordmark off the chip edge; translate re-centres it -->
	<g transform="translate(28.02 16.54) scale(0.78)">
		<g class="mark">
			<path opacity=".8" d="M2 0h2v2h-2zM4 2h2v2h-2zM6 4h2v2h-2zM4 6h2v2h-2zM2 8h2v2h-2z"/>
			<path transform="translate(70 0)" d="M0 12h2v2h-2zM2 12h2v2h-2zM4 12h2v2h-2zM6 12h2v2h-2zM8 12h2v2h-2z"/>
		</g>
		<g class="glyph">
			<path transform="translate(14 0)" d="M0 0h2v2h-2zM8 0h2v2h-2zM0 2h2v2h-2zM8 2h2v2h-2zM2 4h2v2h-2zM6 4h2v2h-2zM4 6h2v2h-2zM2 8h2v2h-2zM6 8h2v2h-2zM0 10h2v2h-2zM8 10h2v2h-2zM0 12h2v2h-2zM8 12h2v2h-2z"/>
			<path transform="translate(28 0)" d="M0 0h2v2h-2zM2 0h2v2h-2zM4 0h2v2h-2zM6 0h2v2h-2zM0 2h2v2h-2zM8 2h2v2h-2zM0 4h2v2h-2zM8 4h2v2h-2zM0 6h2v2h-2zM2 6h2v2h-2zM4 6h2v2h-2zM6 6h2v2h-2zM0 8h2v2h-2zM4 8h2v2h-2zM0 10h2v2h-2zM6 10h2v2h-2zM0 12h2v2h-2zM8 12h2v2h-2z"/>
			<path transform="translate(42 0)" d="M0 0h2v2h-2zM0 2h2v2h-2zM0 4h2v2h-2zM0 6h2v2h-2zM0 8h2v2h-2zM0 10h2v2h-2zM0 12h2v2h-2zM2 12h2v2h-2zM4 12h2v2h-2zM6 12h2v2h-2zM8 12h2v2h-2z"/>
			<path transform="translate(56 0)" d="M2 0h2v2h-2zM4 0h2v2h-2zM6 0h2v2h-2zM8 0h2v2h-2zM0 2h2v2h-2zM0 4h2v2h-2zM2 6h2v2h-2zM4 6h2v2h-2zM6 6h2v2h-2zM8 8h2v2h-2zM8 10h2v2h-2zM0 12h2v2h-2zM2 12h2v2h-2zM4 12h2v2h-2zM6 12h2v2h-2z"/>
		</g>
	</g>
</svg>
