# Lab render profile for helm CI — builtin PG, no Gateway/CNPG/NP.
# Pair with .github/ci/helm-secrets.yaml.

ingress:
  enabled: false
gateway:
  enabled: false
postgresql:
  mode: builtin
  enabled: true
  auth:
    password: ci-pg
networkPolicy:
  enabled: false
metrics:
  serviceMonitor:
    enabled: false
