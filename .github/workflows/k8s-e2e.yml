# Runtime proof for the Helm chart on kind (path-filtered).
# Rebuilds images with the same GHA cache scopes as ci.yml docker — not a
# duplicate publish path; only fires when deploy/docker/nginx/ci-values change.

name: k8s-e2e

# Path lists duplicated on purpose: Actions does not resolve YAML anchors.
on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - docker/**
      - front/nginx.conf
      - .github/ci/**
      - .github/workflows/k8s-e2e.yml
  pull_request:
    paths:
      - deploy/**
      - docker/**
      - front/nginx.conf
      - .github/ci/**
      - .github/workflows/k8s-e2e.yml

concurrency:
  group: k8s-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: xrelease:dev
          cache-from: type=gha,scope=backend

      - name: Build UI image
        uses: docker/build-push-action@v7
        with:
          context: ./front
          file: ./docker/Dockerfile.ui
          platforms: linux/amd64
          load: true
          tags: xrelease-ui:dev
          cache-from: type=gha,scope=ui

      - uses: helm/kind-action@v1
        with:
          cluster_name: xrelease-e2e

      - name: Load images into kind
        run: kind load docker-image xrelease:dev xrelease-ui:dev --name xrelease-e2e

      - name: Install chart
        run: |
          helm upgrade --install xrelease deploy/helm/xrelease \
            --namespace xrelease --create-namespace \
            -f .github/ci/helm-kind.yaml \
            --wait --timeout 6m

      - name: Endpoints are component-scoped
        run: |
          set -e
          # Apprise off in helm-kind.yaml (lightweight kind profile).
          for svc in xrelease xrelease-ui xrelease-postgresql; do
            n=$(kubectl -n xrelease get endpointslice \
              -l "kubernetes.io/service-name=$svc" \
              -o jsonpath='{range .items[*].endpoints[*]}{.targetRef.name}{"\n"}{end}' \
              | grep -c . || true)
            echo "$svc endpoints: $n"
            kubectl -n xrelease get endpointslice -l "kubernetes.io/service-name=$svc" \
              -o jsonpath='{range .items[*].endpoints[*]}  {.targetRef.name}{"\n"}{end}'
            [ "$n" -eq 1 ] || { echo "$svc must have exactly 1 endpoint, got $n" >&2; exit 1; }
          done
          ! kubectl -n xrelease get svc xrelease-apprise >/dev/null 2>&1

      - name: API answers through the Service and through UI nginx
        run: |
          set -e
          kubectl -n xrelease run smoke --image=curlimages/curl:8.11.1 --restart=Never \
            --command -- sleep 300
          kubectl -n xrelease wait --for=condition=Ready pod/smoke --timeout=120s
          for i in $(seq 1 10); do
            kubectl -n xrelease exec smoke -- curl -sf -o /dev/null -w '%{http_code}\n' \
              http://xrelease:8080/ready
          done
          for i in $(seq 1 10); do
            kubectl -n xrelease exec smoke -- curl -sf -o /dev/null -w '%{http_code}\n' \
              http://xrelease-ui/ready
          done
          code=$(kubectl -n xrelease exec smoke -- curl -s -o /dev/null -w '%{http_code}' \
            http://xrelease-ui/metrics)
          [ "$code" = "404" ] || { echo "UI exposed /metrics: HTTP $code" >&2; exit 1; }
          kubectl -n xrelease exec smoke -- curl -sf http://xrelease:8080/metrics \
            | grep -q '^xrelease_'

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n xrelease get pods,svc,endpointslice -o wide || true
          kubectl -n xrelease describe pods || true
          kubectl -n xrelease logs -l app.kubernetes.io/component=server --tail=200 || true
          kubectl -n xrelease logs -l app.kubernetes.io/component=postgresql --tail=100 || true
