name: release

on:
  push:
    # Strict semver tags only (rejects mistaken v.0.1.0)
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag (form v0.1.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Resolve tag / version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Must be vMAJOR.MINOR.PATCH — not v.0.1.0 / v1.2 / etc.
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "expected tag like v0.1.0 (digits after v), got: $TAG" >&2
            exit 1
          fi

          # workflow_dispatch needs an *existing* tag — checkout cannot create it
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              {
                echo "### Tag \`${TAG}\` does not exist on the remote"
                echo
                echo "\`release\` only builds an **already pushed** tag."
                echo
                echo "Create it first:"
                echo "1. Actions → **version-bump** → patch/minor/major (needs \`RELEASE_TOKEN\`),"
                echo "   or locally: \`git tag ${TAG} && git push origin ${TAG}\`"
                echo "2. Re-run **release** with the same tag (or let the tag push start it)."
                echo
                echo "Current tip on main may already be a newer Cargo version — tag must match it."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Tag ${TAG} not found on origin. Run version-bump (or git tag + push) first." >&2
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ver.outputs.tag }}
          fetch-tags: true

      - name: Tag matches repo versions
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          python3 scripts/bump-version.py --check
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag v$VERSION does not match Cargo.toml version $CARGO_VERSION" >&2
            echo "Run the version-bump workflow on main first." >&2
            exit 1
          fi

  binaries:
    name: binary (linux-amd64)
    needs: preflight
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # pin action SHA; toolchain must match rust-toolchain.toml
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-amd64

      - name: Install build deps (librdkafka / OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libssl-dev libsasl2-dev zlib1g-dev

      - name: Build xrelease (backend) + xrctl (CLI)
        # Whole workspace: backend ships every notifier sink (including brokers);
        # the same pass produces the standalone `xrctl` client.
        # linux/amd64 only — arm64 dropped (aws-lc / cross sysroot pain).
        run: cargo build --release --locked --workspace

      - name: Package archives
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          REL="target/release"
          CHECKSUMS="checksums-${VERSION}-linux-amd64.sha256"

          DAEMON="xrelease-${VERSION}-linux-amd64.tar.gz"
          tar -C "${REL}" -czf "${DAEMON}" xrelease
          sha256sum "${DAEMON}" >> "${CHECKSUMS}"

          CLI="xrctl-${VERSION}-linux-amd64.tar.gz"
          tar -C "${REL}" -czf "${CLI}" xrctl
          sha256sum "${CLI}" >> "${CHECKSUMS}"

      - uses: actions/upload-artifact@v7
        with:
          name: xrelease-linux-amd64
          path: |
            xrelease-*.tar.gz
            xrctl-*.tar.gz
            checksums-*.sha256

  docker:
    name: docker (${{ matrix.component }})
    needs: preflight
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            file: ./docker/Dockerfile
            image_suffix: ""
          - component: cli
            context: .
            file: ./docker/Dockerfile.cli
            image_suffix: "-cli"
          - component: ui
            context: ./front
            file: ./docker/Dockerfile.ui
            image_suffix: "-ui"
            # Auth is runtime (/ui-config.js); Dockerfile defaults VITE_AUTH_MODE=local
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase owner/repo; github.repository may contain capitals
      # (e.g. Myskiv-Ivan/xrelease). Compose/Helm already pin ghcr.io/myskiv-ivan/…
      - name: Image repository (lowercase)
        id: image
        run: |
          owner_repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner_repo}${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.preflight.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.preflight.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.preflight.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          # Same scopes as ci.yml docker matrix (backend|cli|ui) — warm from PR/main smoke.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # OCI Helm chart → oci://ghcr.io/<owner>/charts/xrelease:<version>
  # Overlays (deploy/k8s/values.yaml, …) stay in the git tag; pull them with
  # curl or clone the tagged tree. Chart package itself is self-contained for lab install.
  helm:
    name: helm chart (OCI)
    needs: preflight
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: azure/setup-helm@v5
        with:
          version: v3.21.3
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package, push, sign
        id: chart
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          owner_repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          owner="${owner_repo%%/*}"
          # Same layout as nginx-gateway-fabric / common GHCR charts: …/charts/<name>
          charts_oci="${{ env.REGISTRY }}/${owner}/charts"
          helm lint deploy/helm/xrelease \
            -f deploy/k8s/values.yaml \
            --set secrets.adminPassword=ci
          helm package deploy/helm/xrelease -d dist-chart
          # helm push prints "Pushed: …" and "Digest: sha256:…"
          push_out="$(helm push "dist-chart/xrelease-${VERSION}.tgz" "oci://${charts_oci}" 2>&1)"
          echo "$push_out"
          digest="$(echo "$push_out" | sed -n 's/^Digest: //p' | tail -n1)"
          if [ -z "$digest" ]; then
            echo "helm push did not report a digest" >&2
            exit 1
          fi
          cosign sign --yes "${charts_oci}/xrelease@${digest}"
          {
            echo "oci=oci://${charts_oci}/xrelease"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
          sha256sum "dist-chart/xrelease-${VERSION}.tgz" > "dist-chart/xrelease-${VERSION}.tgz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: xrelease-helm-chart
          path: |
            dist-chart/xrelease-*.tgz
            dist-chart/xrelease-*.tgz.sha256

  github-release:
    name: GitHub Release
    needs: [preflight, binaries, docker, helm]
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: xrelease-*
          merge-multiple: true

      - name: Merge checksums
        run: |
          find dist -name 'checksums-*.sha256' -exec cat {} \; | sort -u > dist/checksums.sha256
          find dist -name 'checksums-*.sha256' -delete
          # Keep the chart .tgz.sha256 next to the package (not folded into binary checksums).

      - name: Release notes body
        id: notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          IMAGE="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          OWNER="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]' | cut -d/ -f1)"
          CHART_OCI="oci://${REGISTRY}/${OWNER}/charts/xrelease"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/deploy/k8s"
          {
            echo "## Docker images"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "docker pull ${IMAGE}-cli:${VERSION}"
            echo "docker pull ${IMAGE}-ui:${VERSION}"
            echo '```'
            echo
            echo "Images are tagged \`${VERSION}\`, \`$(echo "$VERSION" | cut -d. -f1-2)\`, \`$(echo "$VERSION" | cut -d. -f1)\`, and \`latest\` (cosign-signed + SBOM)."
            echo
            echo "\`xrelease-cli\` is the lean \`xrctl\` image for CI/CD (HTTP client only — no Postgres)."
            echo
            echo '```bash'
            echo "docker run --rm \\"
            echo "  -v \"\$PWD:/work\" -w /work \\"
            echo "  ${IMAGE}-cli:${VERSION} \\"
            echo "  xrctl --api-url https://xrelease.example.com \\"
            echo "  --api-key \"\$XRELEASE_API_KEY\" \\"
            echo "  apply app/releases.yaml --if-match none --label \"\$CI_COMMIT_SHA\""
            echo '```'
            echo
            echo "Or set the job image to \`${IMAGE}-cli\` and run \`xrctl\` in \`script:\` (no DinD)."
            echo
            echo "UI auth mode is runtime (\`VITE_*\` → \`/ui-config.js\`); default \`local\`."
            echo "OIDC: set \`VITE_AUTH_MODE\` / \`VITE_OIDC_*\` on the UI container and restart — no rebuild."
            echo
            echo "Compose (published images — no build):"
            echo
            echo '```bash'
            echo "cp .env.example .env"
            echo "docker compose up -d"
            echo '```'
            echo
            echo "## Helm chart"
            echo
            echo "OCI (cosign-signed): \`${CHART_OCI}\` version \`${VERSION}\`."
            echo "Default overlay pins \`image.tag: \"${VERSION}\"\` — fetch YAML from the tag, edit hostname + password, install:"
            echo
            echo '```bash'
            echo "# platform once: docs/getting-started/kubernetes.md (CNPG + Gateway)"
            echo "curl -fsSLO ${RAW}/values.yaml"
            echo "curl -fsSLO ${RAW}/values.secrets.example.yaml"
            echo "cp values.secrets.example.yaml values.secrets.yaml"
            echo "# edit gateway.hostnames in values.yaml; set secrets.adminPassword in values.secrets.yaml"
            echo "helm upgrade --install xrelease ${CHART_OCI} --version ${VERSION} \\"
            echo "  --namespace xrelease --create-namespace \\"
            echo "  -f values.yaml \\"
            echo "  -f values.secrets.yaml"
            echo '```'
            echo
            echo "Chart \`.tgz\` is also attached to this release. Lab install (chart defaults + secrets file):"
            echo
            echo '```bash'
            echo "curl -fsSLO ${RAW}/values.secrets.example.yaml"
            echo "cp values.secrets.example.yaml values.secrets.yaml   # set adminPassword"
            echo "helm upgrade --install xrelease ${CHART_OCI} --version ${VERSION} \\"
            echo "  --namespace xrelease --create-namespace \\"
            echo "  -f values.secrets.yaml"
            echo '```'
            echo
            echo "Platform prerequisites and variants: docs/getting-started/kubernetes.md"
            echo
            echo "## Binary archives"
            echo
            echo "Two archives per platform: \`xrelease\` (the backend) and \`xrctl\` (the management CLI)."
            echo "The backend binary includes Apprise/Novu/Slack/Telegram/SMTP/webhook and broker sinks (Kafka/NATS/RabbitMQ)."
            echo "\`xrctl\` is a pure HTTP client for a running instance — it needs no database or config file, so it runs from a laptop or CI on its own (binary or \`${IMAGE}-cli\` image)."
            echo
            echo '```bash'
            echo "tar xzf xrelease-*-linux-amd64.tar.gz && ./xrelease --help"
            echo "tar xzf xrctl-*-linux-amd64.tar.gz && ./xrctl --help"
            echo '```'
            echo
            echo "Verify with \`checksums.sha256\` (binaries) / \`xrelease-${VERSION}.tgz.sha256\` (chart)."
            echo
            echo "CI apply guide: docs/operations/ci-cd.md"
          } > release-body.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          body_path: release-body.md
