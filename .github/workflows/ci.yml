# CI — format, lint, test, security, config validate, front, docker smoke, helm lint

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail-fast version gate — no Rust toolchain (seconds, not minutes).
  version-sync:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Version sync
        run: python3 scripts/bump-version.py --check

  rust:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    # The store, outbox, config-apply, RBAC, organizations, webhook and
    # observability suites all need PostgreSQL and skip themselves silently when
    # it is unreachable. Without this service `cargo test --workspace` went green
    # while the entire DB-backed integration surface never executed.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: xrelease
          POSTGRES_PASSWORD: xrelease
          POSTGRES_DB: xrelease_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # pin action SHA; toolchain must match rust-toolchain.toml
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install build deps (librdkafka / OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libssl-dev libsasl2-dev zlib1g-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        env:
          # Both names are in use: the store/config-apply suites read
          # XRELEASE_TEST_POSTGRES_URL, the organizations suite XRELEASE_DATABASE_URL.
          XRELEASE_TEST_POSTGRES_URL: "postgres://xrelease:xrelease@localhost:5432/xrelease_test"
          XRELEASE_DATABASE_URL: "postgres://xrelease:xrelease@localhost:5432/xrelease_test"
          # config_api.source = "api" refuses to seal app_secret without a key,
          # so every config-apply e2e fails validation (422) unless this is set.
          XRELEASE_CONFIG_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
        run: cargo test --workspace --locked

      # Incremental after clippy/test — reuse target/ instead of a cold link via cargo-run.
      - name: Build xrelease binary
        run: cargo build --locked --bin xrelease

      - name: Validate bootstrap + app config
        env:
          XRELEASE_WEBHOOK_SECRET: "ci-test-secret"
          XRELEASE_API_KEY: "ci-test-key"
          GITHUB_TOKEN: "ci-placeholder"
          # Root bootstrap.toml has no [database] and source=api — same as Compose/.env.
          XRELEASE_DATABASE_URL: "postgres://xrelease:xrelease@localhost:5432/xrelease"
          # 32-byte AES key (base64); offline validate only checks presence + API mode.
          XRELEASE_CONFIG_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
        run: |
          set -euo pipefail
          sudo mkdir -p /data
          BIN=./target/debug/xrelease
          # Lab multi-org root config (empty stub app is unused at runtime)
          "$BIN" --config bootstrap.toml validate --format json
          # Filled single-doc sample (strict)
          "$BIN" \
            --config deploy/examples/infra-app/bootstrap.toml \
            --app deploy/examples/infra-app/app/releases.yaml \
            validate --strict --format json

  security:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Rust advisories + licenses (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

      - name: npm audit (high+)
        working-directory: front
        run: npm audit --audit-level=high

      - name: Trivy filesystem + misconfig scan
        # Advisory on PR: fail the step (annotation) but do not block merge until findings are triaged.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  front:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  helm:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Lint chart
        run: helm lint deploy/helm/xrelease -f deploy/k8s/ci/values-secrets.yaml

      - name: Template render (operator defaults)
        run: |
          helm template xrelease deploy/helm/xrelease \
            -f deploy/k8s/ci/values-secrets.yaml \
            > /tmp/xrelease-manifests.yaml
          grep -q 'kind: Deployment' /tmp/xrelease-manifests.yaml
          grep -q 'kind: StatefulSet' /tmp/xrelease-manifests.yaml
          grep -q 'kind: Ingress' /tmp/xrelease-manifests.yaml
          grep -q 'xrelease-apprise' /tmp/xrelease-manifests.yaml

      - name: Template dev overlay (local images)
        run: |
          helm template xrelease deploy/helm/xrelease \
            -f deploy/k8s/values.dev.yaml \
            -f deploy/k8s/ci/values-secrets.yaml \
            > /tmp/xrelease-dev.yaml
          grep -q 'image: "xrelease:dev"' /tmp/xrelease-dev.yaml
          grep -q 'image: "xrelease-ui:dev"' /tmp/xrelease-dev.yaml

      - name: Reject replicaCount > 1
        run: |
          if helm template xrelease deploy/helm/xrelease \
            -f deploy/k8s/ci/values-bad-replicas.yaml \
            -f deploy/k8s/ci/values-secrets.yaml \
            2>/tmp/helm-fail.txt; then
            echo "expected helm template to fail for replicaCount=2" >&2
            exit 1
          fi
          grep -qi 'replicaCount must be 1' /tmp/helm-fail.txt

  # Compose validity does not need rust/front — run in parallel with them.
  compose:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Compose config (images + dev build)
        run: |
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f docker/docker-compose.dev.yaml config --quiet

  # amd64-only smoke (release.yml publishes linux/amd64 only — no arm64/QEMU).
  docker:
    name: docker (${{ matrix.component }})
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    needs: [rust, front]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            file: ./docker/Dockerfile
            tag: xrelease:ci
          - component: cli
            context: .
            file: ./docker/Dockerfile.cli
            tag: xrelease-cli:ci
          - component: ui
            context: ./front
            file: ./docker/Dockerfile.ui
            tag: xrelease-ui:ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
