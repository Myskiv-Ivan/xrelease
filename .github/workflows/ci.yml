# CI — format, lint, test, security, config validate, front, docker smoke, helm lint

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail-fast version gate — no Rust toolchain (seconds, not minutes).
  version-sync:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Version sync
        run: python3 scripts/bump-version.py --check

  rust:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    # The store, outbox, config-apply, RBAC, organizations, webhook and
    # observability suites all need PostgreSQL and skip themselves silently when
    # it is unreachable. Without this service `cargo test --workspace` went green
    # while the entire DB-backed integration surface never executed.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: xrelease
          POSTGRES_PASSWORD: xrelease
          POSTGRES_DB: xrelease_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # pin action SHA; toolchain must match rust-toolchain.toml
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install build deps (librdkafka / OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libssl-dev libsasl2-dev zlib1g-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        env:
          # Both names are in use: the store/config-apply suites read
          # XRELEASE_TEST_POSTGRES_URL, the organizations suite XRELEASE_DATABASE_URL.
          XRELEASE_TEST_POSTGRES_URL: "postgres://xrelease:xrelease@localhost:5432/xrelease_test"
          XRELEASE_DATABASE_URL: "postgres://xrelease:xrelease@localhost:5432/xrelease_test"
          # config_api.source = "api" refuses to seal app_secret without a key,
          # so every config-apply e2e fails validation (422) unless this is set.
          XRELEASE_CONFIG_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
        run: cargo test --workspace --locked

      # Incremental after clippy/test — reuse target/ instead of a cold link via cargo-run.
      - name: Build xrelease binary
        run: cargo build --locked --bin xrelease

      - name: Validate bootstrap + app config
        env:
          XRELEASE_WEBHOOK_SECRET: "ci-test-secret"
          XRELEASE_API_KEY: "ci-test-key"
          GITHUB_TOKEN: "ci-placeholder"
          # Root bootstrap.toml has no [database] and source=api — same as Compose/.env.
          XRELEASE_DATABASE_URL: "postgres://xrelease:xrelease@localhost:5432/xrelease"
          # 32-byte AES key (base64); offline validate only checks presence + API mode.
          XRELEASE_CONFIG_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
        run: |
          set -euo pipefail
          sudo mkdir -p /data
          BIN=./target/debug/xrelease
          # Lab multi-org root config (empty stub app is unused at runtime)
          "$BIN" --config bootstrap.toml validate --format json
          # Filled single-doc sample (strict)
          "$BIN" \
            --config deploy/examples/infra-app/bootstrap.toml \
            --app deploy/examples/infra-app/app/releases.yaml \
            validate --strict --format json

  security:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Rust advisories + licenses (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

      - name: npm audit (high+)
        working-directory: front
        run: npm audit --audit-level=high

      - name: Trivy filesystem + misconfig scan
        # Advisory on PR: fail the step (annotation) but do not block merge until findings are triaged.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  front:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Chart correctness without a cluster. Runtime proof (images boot, nginx
  # proxies, endpoints resolve) lives in .github/workflows/k8s-e2e.yml, which
  # only fires when deploy/ or docker/ changes.
  helm:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Lint, render default + lab, check shape
        run: |
          set -euo pipefail
          C=deploy/helm/xrelease
          # Write values via Python so GHA `run: |` indent cannot nest YAML keys.
          python3 - <<'PY'
          from pathlib import Path
          Path("/tmp/ci-secrets.yaml").write_text(
              "secrets:\n  adminPassword: ci\n", encoding="utf-8"
          )
          Path("/tmp/lab.yaml").write_text(
              "ingress:\n"
              "  enabled: false\n"
              "gateway:\n"
              "  enabled: false\n"
              "postgresql:\n"
              "  mode: builtin\n"
              "  enabled: true\n"
              "  auth:\n"
              "    password: ci-pg\n"
              "ui:\n"
              "  replicaCount: 1\n"
              "networkPolicy:\n"
              "  enabled: false\n"
              "metrics:\n"
              "  serviceMonitor:\n"
              "    enabled: false\n",
              encoding="utf-8",
          )
          PY

          helm lint $C -f /tmp/ci-secrets.yaml -f deploy/k8s/values.yaml
          helm template xrelease $C -f /tmp/ci-secrets.yaml -f deploy/k8s/values.yaml >/tmp/default.yaml
          helm template xrelease $C -f /tmp/ci-secrets.yaml -f /tmp/lab.yaml >/tmp/lab-render.yaml
          printf 'ui:\n  enabled: false\n' >/tmp/no-ui.yaml
          helm template xrelease $C -f /tmp/ci-secrets.yaml -f deploy/k8s/values.yaml -f /tmp/no-ui.yaml >/dev/null

          for k in 'kind: Cluster' 'kind: HTTPRoute' 'kind: ServiceMonitor' \
                   'kind: PodDisruptionBudget' 'key: uri' 'helm.sh/resource-policy: keep'; do
            grep -q "$k" /tmp/default.yaml || { echo "default render missing: $k" >&2; exit 1; }
          done
          ! grep -qE '^kind: (Ingress|StatefulSet)' /tmp/default.yaml
          grep -q 'kind: StatefulSet' /tmp/lab-render.yaml
          ! grep -q 'kind: PodDisruptionBudget' /tmp/lab-render.yaml
          ! grep -q 'proxy_pass .*:8080/metrics' /tmp/default.yaml
          printf 'ui:\n  exposeMetrics: true\n' >/tmp/expose-metrics.yaml
          helm template xrelease $C -f /tmp/ci-secrets.yaml -f deploy/k8s/values.yaml \
            -f /tmp/expose-metrics.yaml | grep -q 'proxy_pass .*:8080/metrics'
          [ "$(grep -m1 checksum/ui-nginx /tmp/default.yaml)" \
            != "$(helm template xrelease $C -f /tmp/ci-secrets.yaml -f deploy/k8s/values.yaml \
                 -f /tmp/expose-metrics.yaml | grep -m1 checksum/ui-nginx)" ]
          helm package $C -d /tmp/xrelease-chart
          test -f /tmp/xrelease-chart/xrelease-*.tgz

      - name: Broken values are rejected with an actionable message
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; Path("/tmp/ci-secrets.yaml").write_text("secrets:\n  adminPassword: ci\n")'
          V="-f /tmp/ci-secrets.yaml"
          fails() { m="$1"; shift
            if helm template xrelease deploy/helm/xrelease $V "$@" >/dev/null 2>/tmp/e; then
              echo "expected failure: $*" >&2; exit 1; fi
            grep -qi "$m" /tmp/e || { echo "wrong error for $*:" >&2; cat /tmp/e >&2; exit 1; }; }
          fails 'replicaCount must be 1'                   --set replicaCount=2
          fails 'either ingress.enabled OR gateway'        --set ingress.enabled=true
          fails 'requires gateway.parentRef.name'          --set gateway.parentRef.name=
          fails 'requires postgresql.enabled=false'        --set postgresql.enabled=true
          fails 'requires postgresql.cnpg.clusterName'     --set postgresql.cnpg.clusterName=
          fails 'no database configured'                   --set postgresql.mode=external
          fails 'either secrets.existingSecret OR secrets' --set secrets.existingSecret=mine
          fails 'still the CHANGE_ME placeholder'          --set secrets.webhookSecret=CHANGE_ME
          if helm template xrelease deploy/helm/xrelease >/dev/null 2>/tmp/e; then exit 1; fi
          grep -qi 'requires secrets.adminPassword' /tmp/e

      - name: Policy scope and generated secrets
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/default.yaml')) if d]
          for p in (d for d in docs if d['kind'] == 'NetworkPolicy'):
              for way, peer in (('ingress', 'from'), ('egress', 'to')):
                  if any(not r.get(peer) for r in p['spec'].get(way) or []):
                      sys.exit(f"{p['metadata']['name']}: unscoped {way} rule")
          data = {k: v for d in docs if d['kind'] == 'Secret' for k, v in d['stringData'].items()}
          env = {e['name'] for d in docs if d['kind'] == 'Deployment'
                 and d['metadata']['name'] == 'xrelease'
                 for e in d['spec']['template']['spec']['containers'][0]['env']}
          gen = {'XRELEASE_API_KEY', 'XRELEASE_WEBHOOK_SECRET',
                 'XRELEASE_SESSION_SECRET', 'XRELEASE_CONFIG_ENCRYPTION_KEY'}
          if gen - env:
              sys.exit(f'generated secrets never reach the pod: {sorted(gen - env)}')
          k = data['XRELEASE_CONFIG_ENCRYPTION_KEY']
          if len(k) != 64 or k.strip('0123456789abcdef'):
              sys.exit('ledger key is not the 64-char hex the backend parses')
          print('policy scope and generated secrets ok')
          PY

  compose:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Compose config (images + dev build)
        run: |
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f docker/docker-compose.dev.yaml config --quiet

  # amd64-only smoke (release.yml publishes linux/amd64 only — no arm64/QEMU).
  docker:
    name: docker (${{ matrix.component }})
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    needs: [rust, front]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            file: ./docker/Dockerfile
            tag: xrelease:ci
          - component: cli
            context: .
            file: ./docker/Dockerfile.cli
            tag: xrelease-cli:ci
          - component: ui
            context: ./front
            file: ./docker/Dockerfile.ui
            tag: xrelease-ui:ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
