# CI — format, lint, test, security, config validate, front, docker smoke, helm lint

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Version sync
        run: python3 scripts/bump-version.py --check

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Rust advisories + licenses (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

      - name: npm audit (high+)
        working-directory: front
        run: npm audit --audit-level=high || true

      - name: Trivy filesystem + misconfig scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  config:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2

      - name: Validate bootstrap + app config
        env:
          XRELEASE_WEBHOOK_SECRET: "ci-test-secret"
          XRELEASE_API_KEY: "ci-test-key"
          GITHUB_TOKEN: "ci-placeholder"
        run: |
          sudo mkdir -p /data
          # Lab multi-org root config (empty stub app is unused at runtime)
          cargo run -- --config bootstrap.toml validate --format json
          # Filled single-doc sample (strict)
          cargo run -- \
            --config deploy/examples/infra-app/bootstrap.toml \
            --app deploy/examples/infra-app/app/releases.yaml \
            validate --strict --format json

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Resolve app version
        id: ver
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint deploy/helm/xrelease -f deploy/k8s/ci/values-secrets.yaml

      - name: Chart version matches Cargo.toml
        run: |
          CHART_APP="$(grep -E '^appVersion:' deploy/helm/xrelease/Chart.yaml | sed -E 's/.*\"?([0-9]+\.[0-9]+\.[0-9]+)\"?.*/\1/')"
          test "$CHART_APP" = "${{ steps.ver.outputs.version }}"

      - name: Template render (operator defaults)
        run: |
          helm template xrelease deploy/helm/xrelease \
            -f deploy/k8s/ci/values-secrets.yaml \
            > /tmp/xrelease-manifests.yaml
          grep -q 'kind: Deployment' /tmp/xrelease-manifests.yaml
          grep -q 'kind: StatefulSet' /tmp/xrelease-manifests.yaml
          grep -q 'kind: Ingress' /tmp/xrelease-manifests.yaml
          grep -q 'xrelease-apprise' /tmp/xrelease-manifests.yaml

      - name: Template dev overlay (local images)
        run: |
          helm template xrelease deploy/helm/xrelease \
            -f deploy/k8s/values.dev.yaml \
            -f deploy/k8s/ci/values-secrets.yaml \
            > /tmp/xrelease-dev.yaml
          grep -q 'image: "xrelease:dev"' /tmp/xrelease-dev.yaml
          grep -q 'image: "xrelease-ui:dev"' /tmp/xrelease-dev.yaml

      - name: Reject replicaCount > 1
        run: |
          if helm template xrelease deploy/helm/xrelease \
            -f deploy/k8s/ci/values-bad-replicas.yaml \
            -f deploy/k8s/ci/values-secrets.yaml \
            2>/tmp/helm-fail.txt; then
            echo "expected helm template to fail for replicaCount=2" >&2
            exit 1
          fi
          grep -qi 'replicaCount must be 1' /tmp/helm-fail.txt

  docker:
    runs-on: ubuntu-latest
    needs: [rust, front]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Compose config (images + dev build)
        run: |
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f docker/docker-compose.dev.yaml config --quiet

      - name: Build backend (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: xrelease:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build CLI / xrctl (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.cli
          platforms: linux/amd64
          push: false
          tags: xrelease-cli:ci
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli

      - name: Build UI (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: ./front
          file: ./docker/Dockerfile.ui
          platforms: linux/amd64
          push: false
          tags: xrelease-ui:ci
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Build UI with OIDC args (smoke)
        uses: docker/build-push-action@v7
        with:
          context: ./front
          file: ./docker/Dockerfile.ui
          platforms: linux/amd64
          push: false
          tags: xrelease-ui:ci-oidc
          build-args: |
            VITE_AUTH_MODE=hybrid
            VITE_OIDC_ISSUER=https://auth.example.com/realms/xrelease
            VITE_OIDC_CLIENT_ID=xrelease-ui
          cache-from: type=gha,scope=ui-oidc
          cache-to: type=gha,mode=max,scope=ui-oidc
