# CI — quality gates only (no publish).
#
# DAG:
#   version-sync ──► rust | front | security | helm | compose
#   rust + front ──► docker (amd64 smoke; GHA cache shared with release / k8s-e2e)
#   pull_request ──► dependency-review (GitHub Dependency Graph diff)
#
# Runtime Helm proof: k8s-e2e.yml (path-filtered). Publish: release.yml on tags.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# dependency-review overrides with pull-requests: write for PR comments.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version-sync:
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Version sync
        run: python3 scripts/bump-version.py --check

  # PR-only: GitHub Dependency Graph diff (new/changed deps). Needs Dependency
  # graph enabled (public repos: on by default; private: Settings → Code security).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          show-openssf-scorecard: false

  # Lockfile / advisory gates (every PR + main). Complements dependency-review.
  security:
    needs: [version-sync]
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Rust advisories + licenses (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

      - name: npm audit (high+, lockfile only)
        working-directory: front
        run: npm audit --audit-level=high --package-lock-only

      - name: OSV Scanner (Cargo.lock + package-lock.json)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=front/package-lock.json

      - name: Trivy secrets + misconfig
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"

  rust:
    needs: [version-sync]
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: xrelease
          POSTGRES_PASSWORD: xrelease
          POSTGRES_DB: xrelease_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install build deps (librdkafka / OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libssl-dev libsasl2-dev zlib1g-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        env:
          XRELEASE_TEST_POSTGRES_URL: "postgres://xrelease:xrelease@localhost:5432/xrelease_test"
          XRELEASE_DATABASE_URL: "postgres://xrelease:xrelease@localhost:5432/xrelease_test"
          XRELEASE_CONFIG_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
        run: cargo test --workspace --locked

      - name: Build xrelease binary
        run: cargo build --locked --bin xrelease

      - name: Validate bootstrap + app config
        env:
          XRELEASE_WEBHOOK_SECRET: "ci-test-secret"
          XRELEASE_API_KEY: "ci-test-key"
          GITHUB_TOKEN: "ci-placeholder"
          XRELEASE_DATABASE_URL: "postgres://xrelease:xrelease@localhost:5432/xrelease"
          XRELEASE_CONFIG_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
        run: |
          set -euo pipefail
          sudo mkdir -p /data
          BIN=./target/debug/xrelease
          "$BIN" --config bootstrap.toml validate --format json
          "$BIN" \
            --config deploy/examples/infra-app/bootstrap.toml \
            --app deploy/examples/infra-app/app/releases.yaml \
            validate --strict --format json

  front:
    needs: [version-sync]
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  helm:
    needs: [version-sync]
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Lint, render default + lab, check shape
        run: |
          set -euo pipefail
          C=deploy/helm/xrelease
          S=.github/ci/helm-secrets.yaml

          helm lint $C -f $S -f deploy/k8s/values.yaml
          helm template xrelease $C -f $S -f deploy/k8s/values.yaml >/tmp/default.yaml
          helm template xrelease $C -f $S -f .github/ci/helm-lab.yaml >/tmp/lab-render.yaml
          helm template xrelease $C -f $S -f deploy/k8s/values.yaml -f .github/ci/helm-no-ui.yaml >/dev/null

          for k in 'kind: Cluster' 'kind: HTTPRoute' 'kind: ServiceMonitor' \
                   'key: uri' 'helm.sh/resource-policy: keep'; do
            grep -q "$k" /tmp/default.yaml || { echo "default render missing: $k" >&2; exit 1; }
          done
          ! grep -qE '^kind: (Ingress|StatefulSet)' /tmp/default.yaml
          ! grep -q 'kind: PodDisruptionBudget' /tmp/default.yaml
          grep -q 'kind: StatefulSet' /tmp/lab-render.yaml
          ! grep -q 'kind: PodDisruptionBudget' /tmp/lab-render.yaml
          helm template xrelease $C -f $S -f deploy/k8s/values.yaml \
            --set ui.replicaCount=2 | grep -q 'kind: PodDisruptionBudget'
          ! grep -q 'proxy_pass .*:8080/metrics' /tmp/default.yaml
          helm template xrelease $C -f $S -f deploy/k8s/values.yaml \
            -f .github/ci/helm-expose-metrics.yaml | grep -q 'proxy_pass .*:8080/metrics'
          [ "$(grep -m1 checksum/ui-nginx /tmp/default.yaml)" \
            != "$(helm template xrelease $C -f $S -f deploy/k8s/values.yaml \
                 -f .github/ci/helm-expose-metrics.yaml | grep -m1 checksum/ui-nginx)" ]
          helm package $C -d /tmp/xrelease-chart
          test -f /tmp/xrelease-chart/xrelease-*.tgz

      - name: Broken values are rejected with an actionable message
        run: |
          set -euo pipefail
          V="-f .github/ci/helm-secrets.yaml"
          fails() { m="$1"; shift
            if helm template xrelease deploy/helm/xrelease $V "$@" >/dev/null 2>/tmp/e; then
              echo "expected failure: $*" >&2; exit 1; fi
            grep -qi "$m" /tmp/e || { echo "wrong error for $*:" >&2; cat /tmp/e >&2; exit 1; }; }
          fails 'replicaCount must be 1'                   --set replicaCount=2
          fails 'either ingress.enabled OR gateway'        --set ingress.enabled=true
          fails 'requires gateway.parentRef.name'          --set gateway.parentRef.name=
          fails 'requires postgresql.enabled=false'        --set postgresql.enabled=true
          fails 'requires postgresql.cnpg.clusterName'     --set postgresql.cnpg.clusterName=
          fails 'no database configured'                   --set postgresql.mode=external
          fails 'either secrets.existingSecret OR secrets' --set secrets.existingSecret=mine
          fails 'still the CHANGE_ME placeholder'          --set secrets.webhookSecret=CHANGE_ME
          if helm template xrelease deploy/helm/xrelease >/dev/null 2>/tmp/e; then exit 1; fi
          grep -qi 'requires secrets.adminPassword' /tmp/e

      - name: Policy scope and generated secrets
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/default.yaml')) if d]
          for p in (d for d in docs if d['kind'] == 'NetworkPolicy'):
              for way, peer in (('ingress', 'from'), ('egress', 'to')):
                  if any(not r.get(peer) for r in p['spec'].get(way) or []):
                      sys.exit(f"{p['metadata']['name']}: unscoped {way} rule")
          data = {k: v for d in docs if d['kind'] == 'Secret' for k, v in d['stringData'].items()}
          env = {e['name'] for d in docs if d['kind'] == 'Deployment'
                 and d['metadata']['name'] == 'xrelease'
                 for e in d['spec']['template']['spec']['containers'][0]['env']}
          gen = {'XRELEASE_API_KEY', 'XRELEASE_WEBHOOK_SECRET',
                 'XRELEASE_SESSION_SECRET', 'XRELEASE_CONFIG_ENCRYPTION_KEY'}
          if gen - env:
              sys.exit(f'generated secrets never reach the pod: {sorted(gen - env)}')
          k = data['XRELEASE_CONFIG_ENCRYPTION_KEY']
          if len(k) != 64 or k.strip('0123456789abcdef'):
              sys.exit('ledger key is not the 64-char hex the backend parses')
          print('policy scope and generated secrets ok')
          PY

  compose:
    needs: [version-sync]
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Compose config (images + dev build)
        run: |
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f docker/docker-compose.dev.yaml config --quiet

  docker:
    name: docker (${{ matrix.component }})
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNS_ON || '["ubuntu-latest"]') }}
    needs: [rust, front]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            file: ./docker/Dockerfile
            tag: xrelease:ci
          - component: cli
            context: .
            file: ./docker/Dockerfile.cli
            tag: xrelease-cli:ci
          - component: ui
            context: ./front
            file: ./docker/Dockerfile.ui
            tag: xrelease-ui:ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
