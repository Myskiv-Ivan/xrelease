version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # svelte-check needs TS programmatic API — not ready for TypeScript 7 yet
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Action tag IS the Rust version (e.g. @1.96). Dependabot must not bump it
      # to fake action versions like @1.100. We pin a commit SHA + rust-toolchain.toml.
      - dependency-name: "dtolnay/rust-toolchain"

  # Backend image (docker/Dockerfile) + UI image (docker/Dockerfile.ui)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
