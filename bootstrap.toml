# Infrastructure bootstrap — NOT desired state (sources/teams/notifiers).
# Secrets live in repo-root `.env` — see `.env.example`.
#
# Active profile below: multi-org + API + UI (dashboard Apply → ledger).
# Root `app/releases.yaml` is ignored while `[[organizations]]` is set.

[api]
listen = "0.0.0.0:8080"
require_auth = true
rate_limit_per_minute = 120
# api_key / oidc / webhook_secret / local-auth → XRELEASE_* in .env

[config_api]
api_config = true
source = "api"
ui_config = true
# apply_scope = "xrelease:config-apply"
# XRELEASE_CONFIG_APPLY_SECRET for HMAC (X-Config-Signature) — optional in lab

[advisories]
# Lab on; binary default off (OSV sees package names). Docs:
# docs/configuration/overview.md#security-advisories
enabled = true

# ── Authoring variants ───────────────────────────────────────────────────────
# Pick ONE [config_api] profile. Full recipes:
#   docs/configuration/overview.md#authoring-variants
# Invalid: api_config=false + source=api; ui_config=true without API apply.
# Multi-org catalogue below is bootstrap-only. Omit [[organizations]] for
# single-document mode.

[[organizations]]
id = "platform"
name = "Platform Engineering"

[[organizations]]
id = "security"
name = "Security Operations"
