# Multi-organization infra — one bootstrap, many desired files (or API/UI ledger).
# Restart to change [[organizations]] membership.

[database]
postgres_url = "postgres://xrelease:xrelease@postgres:5432/xrelease"
prune_seen_after_days = 365
prune_webhooks_after_days = 30
prune_outbox_sent_after_days = 90
prune_interval_hours = 24

[log]
level = "info"

[api]
listen = "0.0.0.0:8080"
require_auth = true
rate_limit_per_minute = 120
# Secrets via repo-root .env — see .env.example

# GitOps: edit app/<org>/releases.yaml then reload / rollout.
# For API/UI push: api_config = true, source = "api" (optional ui_config = true).
# With source = "api", `app` on each org is optional (seed only; omit for UI-first).
[config_api]
api_config = false
source = "local"
ui_config = false

[[organizations]]
id = "platform"
name = "Platform Engineering"
app = "app/platform/releases.yaml"

[[organizations]]
id = "security"
name = "Security Operations"
app = "app/security/releases.yaml"
