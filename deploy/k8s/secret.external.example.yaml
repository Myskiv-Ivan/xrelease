# ExternalSecret skeleton — production replacement for static Secrets.
# Requires External Secrets Operator + configured SecretStore.
#
# Apprise destinations stay in the desired document (ConfigMap / UI apply).
#
#   kubectl apply -f secret.external.example.yaml -n xrelease
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: xrelease-secrets
  namespace: xrelease
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: xrelease-secrets
    creationPolicy: Owner
  data:
    - secretKey: XRELEASE_DATABASE_URL
      remoteRef: { key: xrelease/prod, property: database_url }
    - secretKey: XRELEASE_API_KEY
      remoteRef: { key: xrelease/prod, property: api_key }
    - secretKey: XRELEASE_WEBHOOK_SECRET
      remoteRef: { key: xrelease/prod, property: webhook_secret }
    # - secretKey: XRELEASE_SESSION_SECRET
    #   remoteRef: { key: xrelease/prod, property: session_secret }
    # - secretKey: XRELEASE_ADMIN_USER
    #   remoteRef: { key: xrelease/prod, property: admin_user }
    # - secretKey: XRELEASE_ADMIN_PASSWORD
    #   remoteRef: { key: xrelease/prod, property: admin_password }
    # Same key set as repo-root .env.example — add OIDC / forge / express as needed:
    # - secretKey: XRELEASE_OIDC_ISSUER
    #   remoteRef: { key: xrelease/prod, property: oidc_issuer }
    # - secretKey: XRELEASE_OIDC_JWKS_URI
    #   remoteRef: { key: xrelease/prod, property: oidc_jwks_uri }
    # - secretKey: XRELEASE_OIDC_AUDIENCE
    #   remoteRef: { key: xrelease/prod, property: oidc_audience }
    # Multi-team eXpress Bearers (access_token_env in releases.yaml):
    # - secretKey: XRELEASE_EXPRESS_TOKEN_PLATFORM
    #   remoteRef: { key: xrelease/prod, property: express_platform }
    # - secretKey: XRELEASE_EXPRESS_TOKEN_SECURITY
    #   remoteRef: { key: xrelease/prod, property: express_security }
