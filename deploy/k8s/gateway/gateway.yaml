# Platform Gateway (outside Helm). Chart attaches HTTPRoute via gateway.parentRef.
#   kubectl apply -f deploy/k8s/gateway/gateway.yaml
# gatewayClassName: eg | nginx | istio | cilium | traefik
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: xrelease-gateway
  namespace: xrelease
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "xrelease.example.com"
      allowedRoutes:
        namespaces:
          from: Same

    # HTTPS — create TLS Secret first, then set gateway.parentRef.sectionName: https
