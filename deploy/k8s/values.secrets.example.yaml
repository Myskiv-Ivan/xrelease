# Operator secrets — copy, fill, never commit:
#
#   cp deploy/k8s/values.secrets.example.yaml deploy/k8s/values.secrets.yaml
#   # edit passwords (openssl rand -hex 32 / openssl rand -base64 32)
#   helm upgrade --install xrelease ./deploy/helm/xrelease \
#     --namespace xrelease --create-namespace \
#     -f deploy/k8s/values.secrets.yaml
#
# Chart defaults are the ready stack (PG + UI + Ingress + Apprise).
# Chart rejects empty / CHANGE_ME* sessionSecret, adminPassword, configEncryptionKey.

postgresql:
  auth:
    password: "CHANGE_ME"

secrets:
  apiKey: "CHANGE_ME"
  webhookSecret: "CHANGE_ME"
  sessionSecret: "CHANGE_ME"          # openssl rand -hex 32
  adminUser: "admin"
  adminPassword: "CHANGE_ME"
  configEncryptionKey: "CHANGE_ME"    # openssl rand -base64 32

# Optional — pin tag / Ingress host:
# image:
#   tag: "0.1.0"
#   pullPolicy: Always
# ingress:
#   hosts:
#     - host: xrelease.local
#       paths:
#         - path: /
#           pathType: Prefix
