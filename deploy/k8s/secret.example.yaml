# Kubernetes Secret — same keys as repo-root `.env.example`.
# Fill values, apply once, NEVER commit real secrets to Git.
# Production: replace with ExternalSecret (Vault / AWS SM / GCP SM).
#
# Apprise urls / config_key live in releases.yaml (or UI apply) — not here.
# Compose/Helm may still inject XRELEASE_APPRISE_ENDPOINT for the sidecar URL.
#
#   kubectl apply -f secret.example.yaml -n xrelease
#
apiVersion: v1
kind: Secret
metadata:
  name: xrelease-secrets
  namespace: xrelease
type: Opaque
stringData:
  # ── PostgreSQL ──
  # Chart in-cluster Postgres Service is `{release}-postgresql` (e.g. xrelease-postgresql).
  # With postgresql.enabled=true the chart injects connection-url itself — omit this key.
  XRELEASE_DATABASE_URL: "postgres://xrelease:CHANGE_ME@xrelease-postgresql:5432/xrelease"
  # Managed Postgres with required TLS:
  # XRELEASE_DATABASE_SSL_MODE: "require"
  # XRELEASE_DATABASE_SSL_ROOT_CERT: "/certs/ca.pem"

  # ── Management API + webhooks ──
  XRELEASE_API_KEY: "CHANGE_ME"
  XRELEASE_WEBHOOK_SECRET: "CHANGE_ME"
  # XRELEASE_CONFIG_APPLY_SECRET: "CHANGE_ME"   # when [config_api] apply HMAC
  # AES-256-GCM for config_revision.content (required when source=api).
  # openssl rand -base64 32 — lab placeholder matches .env.example (replace in prod)
  XRELEASE_CONFIG_ENCRYPTION_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

  # ── Local UI auth (dashboard username/password) ──
  XRELEASE_SESSION_SECRET: "CHANGE_ME"
  XRELEASE_ADMIN_USER: "admin"
  XRELEASE_ADMIN_PASSWORD: "CHANGE_ME"

  # ── OIDC (backend JWT validation) ──
  # UI VITE_* are runtime env on the UI Deployment (Helm ui.env) — not this Secret.
  # XRELEASE_OIDC_ISSUER: "https://auth.example.com/realms/xrelease"
  # XRELEASE_OIDC_JWKS_URI: "https://auth.example.com/realms/xrelease/protocol/openid-connect/certs"
  # XRELEASE_OIDC_AUDIENCE: "xrelease-ui"
  # XRELEASE_OIDC_DISCOVERY_URL: "https://auth.example.com/realms/xrelease"
  # XRELEASE_OIDC_REQUIRED_SCOPE: "xrelease:manage"
  # XRELEASE_OIDC_ROLE_CLAIM: "groups"
  # XRELEASE_OIDC_ROLE_ADMIN: "xrelease-admin,admin"
  # XRELEASE_OIDC_ROLE_OPERATOR: "xrelease-operator,operator"
  # XRELEASE_OIDC_ROLE_VIEWER: "xrelease-viewer,viewer"

  # ── Notifier secrets ──
  # XRELEASE_EXPRESS_ACCESS_TOKEN: ""
  # XRELEASE_EXPRESS_TOKEN_PLATFORM: ""   # multi-team example
  # XRELEASE_EXPRESS_TOKEN_SECURITY: ""
  # XRELEASE_SMTP_PASSWORD: ""

  # ── Upstream forge tokens (optional) ──
  # GITHUB_TOKEN: ""
  # GITLAB_TOKEN: ""
