# Multi-team Secret — same base keys as `.env.example` / secret.example.yaml,
# plus per-team eXpress tokens (access_token_env in app/releases.yaml).
#
#   kubectl apply -f secret.multi-team.example.yaml -n xrelease
#
apiVersion: v1
kind: Secret
metadata:
  name: xrelease-secrets
  namespace: xrelease
type: Opaque
stringData:
  XRELEASE_DATABASE_URL: "postgres://xrelease:CHANGE_ME@postgres.xrelease.svc:5432/xrelease"
  XRELEASE_API_KEY: "CHANGE_ME"
  XRELEASE_WEBHOOK_SECRET: "CHANGE_ME"

  # Per-team BotX Bearers (see deploy/examples/multi-team/app/releases.yaml)
  XRELEASE_EXPRESS_TOKEN_PLATFORM: "CHANGE_ME"
  XRELEASE_EXPRESS_TOKEN_SECURITY: "CHANGE_ME"

  # OIDC — same keys as secret.example.yaml / .env.example (optional)
  # XRELEASE_OIDC_ISSUER: "https://auth.example.com/realms/xrelease"
  # XRELEASE_OIDC_JWKS_URI: "https://auth.example.com/realms/xrelease/protocol/openid-connect/certs"
  # XRELEASE_OIDC_AUDIENCE: "xrelease-ui"

  # GITHUB_TOKEN: ""
