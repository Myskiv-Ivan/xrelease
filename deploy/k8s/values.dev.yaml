# Development overlay — local/kind/minikube images (build yourself).
#
#   # Build & load (example for kind):
#   docker build -t xrelease:dev -f docker/Dockerfile .
#   docker build -t xrelease-ui:dev -f docker/Dockerfile.ui front
#   kind load docker-image xrelease:dev xrelease-ui:dev
#
#   cp deploy/k8s/values.secrets.example.yaml deploy/k8s/values.secrets.yaml
#   helm upgrade --install xrelease ./deploy/helm/xrelease \
#     --namespace xrelease --create-namespace \
#     -f deploy/k8s/values.dev.yaml \
#     -f deploy/k8s/values.secrets.yaml
#
# Operators (published GHCR): omit this file — chart defaults + values.secrets.yaml only.

image:
  repository: xrelease
  tag: "dev"
  pullPolicy: Never

ui:
  image:
    repository: xrelease-ui
    tag: "dev"
    pullPolicy: Never

env:
  XRELEASE_LOG: debug

# Optional: NodePort / different Ingress host for local clusters
# ingress:
#   className: nginx
#   hosts:
#     - host: xrelease.local
#       paths:
#         - path: /
#           pathType: Prefix
