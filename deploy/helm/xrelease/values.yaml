# xrelease — default deploy: CNPG + Gateway API + UI + Apprise.
#
# Site overlay (hostname + image tag): deploy/k8s/values.yaml
# Password:           deploy/k8s/values.secrets.example.yaml → values.secrets.yaml
#
#   helm upgrade --install xrelease ./deploy/helm/xrelease \
#     --namespace xrelease --create-namespace \
#     -f deploy/k8s/values.yaml \
#     -f deploy/k8s/values.secrets.yaml
#
# Platform once: docs/getting-started/kubernetes.md

replicaCount: 1

image:
  repository: ghcr.io/myskiv-ivan/xrelease
  tag: ""
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

command:
  - serve

config:
  existingConfigMap: ""
  bootstrapInline: |
    [database]
    postgres_url = "postgres://xrelease@xrelease-postgresql:5432/xrelease"

    [log]
    level = "info"

    [api]
    listen = "0.0.0.0:8080"
    require_auth = true
    rate_limit_per_minute = 120

    [config_api]
    api_config = true
    source = "api"
    ui_config = true
  appInline: |
    defaults:
      interval_secs: 86400
    notifiers:
      - type: apprise
        endpoint: http://xrelease-apprise:8000
        urls: []

database:
  url: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: xrelease.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  api:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: hooks.example.com
        paths:
          - path: /api/v1/webhooks
            pathType: Prefix
          - path: /health
            pathType: Prefix
          - path: /ready
            pathType: Prefix
    tls: []

gateway:
  enabled: true
  parentRef:
    name: xrelease-gateway
    namespace: ""
    sectionName: ""
  hostnames:
    - xrelease.example.com
  annotations: {}
  filters: []
  timeouts:
    request: 120s
  api:
    enabled: false
    parentRef:
      name: ""
      namespace: ""
      sectionName: ""
    hostnames:
      - hooks.example.com
    paths:
      - /api/v1/webhooks
      - /health
      - /ready

postgresql:
  mode: cnpg
  enabled: false
  cnpg:
    create: true
    clusterName: xrelease-db
    namespace: ""
    instances: 1
    imageName: ""
    database: xrelease
    owner: xrelease
    storage:
      size: 20Gi
      storageClass: ""
    walStorage:
      enabled: false
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    postgresql:
      parameters: {}
    affinity:
      enablePodAntiAffinity: true
      topologyKey: kubernetes.io/hostname
    monitoring:
      enablePodMonitor: true
    sslMode: require
    backup:
      enabled: false
      destinationPath: ""
      endpointURL: ""
      retentionPolicy: 30d
      credentialsSecret: ""
  image: postgres:18-alpine
  auth:
    username: xrelease
    password: ""
    database: xrelease
  existingSecret: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    retain: true
  podSecurityContext:
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

apprise:
  enabled: true
  image: caronc/apprise:1.5.1
  service:
    port: 8000
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

ui:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/myskiv-ivan/xrelease-ui
    tag: ""
    pullPolicy: ""
  service:
    type: ClusterIP
    port: 80
  exposeMetrics: false
  env:
    VITE_API_URL: ""
    VITE_AUTH_MODE: local
    VITE_API_KEY_DEFAULT_ROLE: admin
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

env:
  XRELEASE_LOG: info

secrets:
  existingSecret: ""
  adminUser: "admin"
  adminPassword: ""
  apiKey: ""
  webhookSecret: ""
  sessionSecret: ""
  configEncryptionKey: ""
  databaseUrl: ""
  expressAccessToken: ""

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  automountServiceAccountToken: false

metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

networkPolicy:
  enabled: true
  ingressControllerNamespace: envoy-gateway-system
  monitoringNamespace: monitoring
  blockPrivateEgress: true
  extraEgressCIDRs: []

nodeSelector: {}
tolerations: []
affinity: {}

livenessProbe:
  path: /health
  port: 8080
readinessProbe:
  path: /ready
  port: 8080
