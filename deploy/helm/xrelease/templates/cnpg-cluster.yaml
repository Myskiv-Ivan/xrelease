{{- if and (eq .Values.postgresql.mode "cnpg") .Values.postgresql.cnpg.create }}
{{- include "xrelease.validate" . }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgresql.cnpg.clusterName }}
  {{- with .Values.postgresql.cnpg.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    helm.sh/resource-policy: keep
spec:
  instances: {{ .Values.postgresql.cnpg.instances }}
  {{- with .Values.postgresql.cnpg.imageName }}
  imageName: {{ . | quote }}
  {{- end }}

  bootstrap:
    initdb:
      database: {{ .Values.postgresql.cnpg.database | quote }}
      owner: {{ .Values.postgresql.cnpg.owner | quote }}

  storage:
    size: {{ .Values.postgresql.cnpg.storage.size | quote }}
    {{- with .Values.postgresql.cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}

  {{- if .Values.postgresql.cnpg.walStorage.enabled }}
  walStorage:
    size: {{ .Values.postgresql.cnpg.walStorage.size | quote }}
    {{- with .Values.postgresql.cnpg.walStorage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  {{- end }}

  resources:
    {{- toYaml .Values.postgresql.cnpg.resources | nindent 4 }}

  {{- with .Values.postgresql.cnpg.postgresql.parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}

  affinity:
    {{- toYaml .Values.postgresql.cnpg.affinity | nindent 4 }}

  monitoring:
    enablePodMonitor: {{ .Values.postgresql.cnpg.monitoring.enablePodMonitor }}

  {{- if .Values.postgresql.cnpg.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.postgresql.cnpg.backup.retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: {{ .Values.postgresql.cnpg.backup.destinationPath | quote }}
      {{- with .Values.postgresql.cnpg.backup.endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.postgresql.cnpg.backup.credentialsSecret }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .Values.postgresql.cnpg.backup.credentialsSecret }}
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
  {{- end }}
{{- end }}
