{{- if .Values.postgresql.enabled }}
{{- $fullname := include "xrelease.fullname" . -}}
{{- $pgName := include "xrelease.postgresqlName" . -}}
{{- if not .Values.postgresql.existingSecret }}
{{- /*
  Nobody ever types this password: the chart owns the database and hands the
  backend a ready connection URL. Generated on first install, read back from
  the cluster on upgrade so the volume keeps matching the credential.
*/ -}}
{{- $pgPassword := include "xrelease.machineSecret" (dict "ctx" . "secret" $pgName "key" "postgres-password" "value" .Values.postgresql.auth.password "gen" (randAlphaNum 32)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgName }}
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  postgres-password: {{ $pgPassword | quote }}
  # urlquery encodes reserved characters in the password (@ : / # …).
  connection-url: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.auth.username ($pgPassword | urlquery) $pgName .Values.postgresql.auth.database | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $pgName }}
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
---
{{- if .Values.postgresql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pgName }}
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- if .Values.postgresql.persistence.retain }}
  annotations:
    # Survive `helm uninstall` — dropping the release must not drop the data.
    # Delete the PVC by hand to reclaim the volume.
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size | quote }}
  {{- with .Values.postgresql.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $pgName }}
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  # Not headless: one replica is reached through the ClusterIP above, and
  # serviceName is immutable — changing it would break `helm upgrade`.
  serviceName: {{ $pgName }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.postgresql.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          {{- with .Values.postgresql.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret | default $pgName }}
                  key: postgres-password
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            # PG 18+ image VOLUME is /var/lib/postgresql (not …/data).
            - name: PGDATA
              value: /var/lib/postgresql/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.postgresql.auth.username }} -d {{ .Values.postgresql.auth.database }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U {{ .Values.postgresql.auth.username }} -d {{ .Values.postgresql.auth.database }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      # Let PostgreSQL finish a shutdown checkpoint before SIGKILL.
      terminationGracePeriodSeconds: 60
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- if .Values.postgresql.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $pgName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
