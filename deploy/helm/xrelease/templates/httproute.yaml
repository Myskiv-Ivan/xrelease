{{- if .Values.gateway.enabled }}
{{- include "xrelease.validate" . }}
{{- $fullName := include "xrelease.fullname" . -}}
{{- /*
  Gateway API replacement for templates/ingress.yaml. The chart owns the
  HTTPRoute only — the Gateway, its listeners and TLS certificates are
  platform-level objects with their own lifecycle (see
  deploy/k8s/gateway/ and docs/operations/gateway.md).

  Routing matches the Ingress path exactly: everything goes to the UI Service,
  whose nginx proxies /api and the probes to the backend. With ui.enabled=false
  the backend Service takes the whole route.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.parentRef.name }}
      {{- with .Values.gateway.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gateway.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- with .Values.gateway.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        {{- if .Values.ui.enabled }}
        - group: ""
          kind: Service
          name: {{ $fullName }}-ui
          port: {{ .Values.ui.service.port }}
        {{- else }}
        - group: ""
          kind: Service
          name: {{ $fullName }}
          port: {{ .Values.service.port }}
        {{- end }}
{{- if .Values.gateway.api.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-api
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-route
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.api.parentRef.name | default .Values.gateway.parentRef.name }}
      {{- with (.Values.gateway.api.parentRef.namespace | default .Values.gateway.parentRef.namespace) }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gateway.api.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.gateway.api.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- range .Values.gateway.api.paths }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      {{- with .Values.gateway.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $fullName }}
          port: {{ .Values.service.port }}
{{- end }}
{{- end }}
