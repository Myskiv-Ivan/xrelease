{{- if .Values.networkPolicy.enabled }}
{{- $fullName := include "xrelease.fullname" . -}}
{{- $pgName := include "xrelease.postgresqlName" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-server
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: http
          protocol: TCP
    {{- with .Values.networkPolicy.monitoringNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if eq .Values.postgresql.mode "cnpg" }}
    - to:
        {{- if .Values.postgresql.cnpg.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.postgresql.cnpg.namespace }}
          podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.postgresql.cnpg.clusterName }}
        {{- else }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.postgresql.cnpg.clusterName }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if .Values.apprise.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "apprise") | nindent 14 }}
      ports:
        - port: {{ .Values.apprise.service.port }}
          protocol: TCP
    {{- end }}
    - to:
        - ipBlock:
            {{- include "xrelease.internetIpBlock" . | nindent 12 }}
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 587
          protocol: TCP
        - port: 465
          protocol: TCP
    {{- range .Values.networkPolicy.extraEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $pgName }}
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  podSelector:
    matchLabels:
      {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- if .Values.ui.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-ui
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  podSelector:
    matchLabels:
      {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
{{- end }}
{{- if .Values.apprise.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-apprise
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: apprise
spec:
  podSelector:
    matchLabels:
      {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "apprise") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "server") | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            {{- include "xrelease.internetIpBlock" . | nindent 12 }}
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 587
          protocol: TCP
        - port: 465
          protocol: TCP
        - port: 25
          protocol: TCP
    {{- range .Values.networkPolicy.extraEgressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
