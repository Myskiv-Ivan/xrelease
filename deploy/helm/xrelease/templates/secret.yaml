{{- if eq (include "xrelease.createSecret" .) "true" }}
{{- /*
  The four machine secrets below are generated on first install and preserved
  across upgrades — nothing about them is an operator decision. Only
  adminPassword has to be chosen by a human, because a human types it.
  Read a generated value back with:
    kubectl -n {{ .Release.Namespace }} get secret {{ include "xrelease.secretsName" . }} \
      -o jsonpath='{.data.XRELEASE_API_KEY}' | base64 -d
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xrelease.secretsName" . }}
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
type: Opaque
stringData:
  XRELEASE_API_KEY: {{ include "xrelease.machineSecret" (dict "ctx" $ "key" "XRELEASE_API_KEY" "value" .Values.secrets.apiKey "gen" (randAlphaNum 48)) | quote }}
  XRELEASE_WEBHOOK_SECRET: {{ include "xrelease.machineSecret" (dict "ctx" $ "key" "XRELEASE_WEBHOOK_SECRET" "value" .Values.secrets.webhookSecret "gen" (randAlphaNum 48)) | quote }}
  # HS256 key for dashboard session JWTs — 64 hex chars, same shape as
  # `openssl rand -hex 32`.
  XRELEASE_SESSION_SECRET: {{ include "xrelease.machineSecret" (dict "ctx" $ "key" "XRELEASE_SESSION_SECRET" "value" .Values.secrets.sessionSecret "gen" (sha256sum (randAlphaNum 64))) | quote }}
  # AES-256-GCM key sealing app_secret values. The backend accepts 64-char hex
  # or 32-byte base64; sha256sum gives the former.
  XRELEASE_CONFIG_ENCRYPTION_KEY: {{ include "xrelease.machineSecret" (dict "ctx" $ "key" "XRELEASE_CONFIG_ENCRYPTION_KEY" "value" .Values.secrets.configEncryptionKey "gen" (sha256sum (randAlphaNum 64))) | quote }}
  {{- with .Values.secrets.adminUser }}
  XRELEASE_ADMIN_USER: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  XRELEASE_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.databaseUrl }}
  XRELEASE_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.expressAccessToken }}
  XRELEASE_EXPRESS_ACCESS_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
