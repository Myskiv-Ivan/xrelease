apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "xrelease.fullname" . }}
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
# No RoleBinding ships with this chart — the backend never calls the
# Kubernetes API. Pods also set automountServiceAccountToken (CIS 5.1.6).
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
