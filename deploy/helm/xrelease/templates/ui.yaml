{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xrelease.fullname" . }}-ui
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xrelease.fullname" . }}-ui
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart UI when the nginx ConfigMap changes (proxy target, /metrics
        # exposure) and when runtime VITE_* change so docker-entrypoint
        # regenerates /ui-config.js (no image rebuild).
        checksum/ui-nginx: {{ include (print $.Template.BasePath "/ui-nginx.yaml") . | sha256sum }}
        checksum/ui-env: {{ .Values.ui.env | toYaml | sha256sum }}
      labels:
        {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # nginx-unprivileged runs as UID 101 and listens on 8080.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Not read-only: docker-entrypoint.d regenerates /ui-config.js in
            # the web root on every start.
          {{- with .Values.ui.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          {{- if gt (int .Values.ui.replicaCount) 1 }}
          lifecycle:
            preStop:
              # Let the Endpoints update propagate to the front door before
              # nginx stops accepting — otherwise a rollout drops in-flight
              # requests that were already routed to this pod.
              exec:
                command: ["sleep", "5"]
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      {{- include "xrelease.nodeSelector" . | nindent 6 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if gt (int .Values.ui.replicaCount) 1 }}
      # Soft spread: two UI pods on one node buy nothing against node loss.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 20 }}
      {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "xrelease.fullname" . }}-ui-nginx
{{- if gt (int .Values.ui.replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "xrelease.fullname" . }}-ui
  labels:
    {{- include "xrelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  # Only rendered above 1 replica: a PDB over a single pod blocks node drains
  # instead of protecting anything.
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "xrelease.componentSelectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
{{- end }}
{{- end }}
