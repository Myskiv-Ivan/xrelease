# `xrctl` — remote management client for a running `xrelease serve`.
#
# Depends on NOTHING from the `xrelease` crate: it speaks the HTTP API with
# `reqwest` + `serde_json::Value` only, so this binary carries no postgres,
# no vendored OpenSSL, no lettre/feed-rs/broker clients.
[package]
name = "xrelease-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "xrctl — remote management CLI for an xrelease instance"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "xrctl"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
